name: codeql

# CodeQL (security-extended) over yolo's Rust and its GitHub Actions workflows (SECURITY-CI.md).
# build-mode none for both: no cargo build in this job. Results go to code scanning (category
# codeql/<language>) only; pre-existing alerts never fail a PR (GitHub's code scanning check decides
# what a PR introduces).
on:
  push:
    branches: [upgrade/vault]
  pull_request:
  schedule:
    - cron: '29 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: codeql/${{ matrix.language }}
