# yolo CI (audit I-13, I-7; workspace CI/CD design 2026-10-06).
#
# Push / PR tier (every push and pull request on the branches below):
#   check (ubuntu, macos)  fmt, clippy (-D warnings), build (plain and --features regtest), test,
#                          with the toolchain rust-toolchain.toml pins
#   audit (ubuntu)         cargo deny (licences, sources, bans, advisories) + cargo audit
# Nightly tier (workflow_dispatch with tier=nightly; component repos carry no schedule, the node
# lines do):
#   regtest (ubuntu)       tests/regtest.rs against a real ycashd of each node line, the binary taken
#                          from that node line's own CI build artifact (see the job's comment); the
#                          kogany entry (report-only) serves yolo from a koganyd at a pinned kogany
#                          commit, beside two ycash6 nodes (kogany plan W8-c): kogany's koganyd-bin
#                          artifact at that commit when one exists (the contract of the workspace's
#                          docs/plans/kogany/ci-design.md), else a build at the commit
#
# Third-party actions are pinned by commit, never by tag; the comment carries the tag (bump both).
name: ci

on:
  push:
    # The one branch list: harden/yellowback (P1 hardening), upgrade/vault (the network upgrade),
    # main (the branch of record, AGENTS.md rule 2), vaults/kogany-compat (the kogany work's
    # integration branch, kogany plan §4.2 rule 0).
    branches: &branches [main, harden/yellowback, upgrade/vault, vaults/kogany-compat]
  pull_request:
    branches: *branches
  workflow_dispatch:
    inputs:
      tier:
        description: "push = the push/PR jobs only; nightly = also the regtest job against real nodes"
        type: choice
        options: [push, nightly]
        default: push
      node_run_id:
        description: "nightly: a run id of the node line's yellowback-tests workflow to take ycashd from (empty = the newest run on the matching branch that has the artifact)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # rustup (preinstalled on the hosted runners) installs the pinned toolchain and its
      # components from rust-toolchain.toml on first use.
      - run: rustup show active-toolchain
      # Keyed by rust-cache on the rustc version, Cargo.lock/Cargo.toml and the job; restored by the
      # same prefix only. Saved from pushes, not from pull requests (a PR's cache is PR-scoped).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: cargo fmt --check
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked
      - run: cargo build --locked --features regtest
      # The regtest integration test is compiled only with --features regtest and skips without
      # YCASHD; the nightly job below runs it.
      - run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      # Token-free, as chain-viz: rustsec/audit-check posts a check run and needs `checks: write`,
      # which the read-only permissions block above does not grant (first run, 2026-10-02).
      # The two tools at exact versions, cached by exact key (no restore-keys): a hit skips the
      # ~6 min source build.
      - name: cache cargo-deny and cargo-audit
        id: tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-deny-${{ env.CARGO_DENY_VERSION }}-audit-${{ env.CARGO_AUDIT_VERSION }}
      - name: install cargo-deny and cargo-audit
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - run: cargo deny --locked check
      # Its own database path: cargo-deny 0.20 clones into ~/.cargo/advisory-db/<hash>, which cargo-audit then refuses as a non-empty clone target.
      - run: cargo audit --deny warnings --db "$RUNNER_TEMP/advisory-db"

  # Nightly tier, on demand. The regtest test needs a ycashd: building one here costs > 60 min
  # uncached (depends tree, Rust, C++), downloading the node line's own CI build artifact costs
  # seconds, so this job downloads. The node line is matched to this run's branch: upgrade/vault ->
  # upgrade/vault (and the test runs across the Vault activation, YOLO_REGTEST_VAULT),
  # harden/yellowback -> harden/yellowback, anything else -> the node line's branch of record.
  # NODE_ARTIFACT is the node lines' yellowback-tests `build` job artifact `node-bin`: node-bin.tar
  # (ycash-dd) or node-bin.tgz (ycash6), whose tar keeps src/ycashd and src/ycash-cli executable
  # (ycash6 keeps it 30 days outside pull requests and refreshes a branch tip nightly; ycash-dd 3 days;
  # "newest run" takes the newest that still has it).
  regtest:
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly'
    name: regtest (${{ matrix.node_line || matrix.node }})
    needs: check
    # The kogany entry is report-only (kogany plan §5, W8-c): it never fails the run.
    continue-on-error: ${{ matrix.node_line == 'kogany' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: ycash-dd
            of_record: feature/yellowback-price-attest
            pool_node_args: ""
          - node: ycash6
            of_record: feature/yellowback
            pool_node_args: -allowdeprecated=none
          # The third node line (AGENTS.md "The third node line"): yolo serves a kogany node's
          # templates (YOLO_REGTEST_KOGANY, tests/regtest.rs "The kogany mode"), the ycash6 nodes
          # (always vaults/kogany-compat, the kogany work's ycash6 branch: the mode needs the Vault
          # upgrade) hold the wallet and check every block. koganyd at kogany_ref, kogany's
          # vaults/kogany-compat at dd834da8b (the koganyd identity): kogany's koganyd-bin artifact
          # of a push, schedule or dispatch run at that commit when one exists, else built here. Until
          # boyfromcave/zakura-common-ycash exists on GitHub (kogany plan K-2), kogany's
          # [patch.crates-io] cannot resolve, kogany publishes nothing, and this entry fails at
          # the build step.
          - node: ycash6
            node_line: kogany
            of_record: vaults/kogany-compat
            pool_node_args: ""
            kogany_ref: dd834da8b77e882b9e6a00b3ce70f2b30b930c37
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.node_line == 'kogany' && 180 || 60 }}
    env:
      NODE_REPO: boyfromcave/${{ matrix.node }}
      NODE_ARTIFACT: node-bin
      NODE_RUN_ID: ${{ inputs.node_run_id }}
      NODE_OF_RECORD: ${{ matrix.of_record }}
      REF_NAME: ${{ github.ref_name }}
      # The node branch, from a fixed list: this run's branch when it is one of the two lines,
      # else the node line's branch of record. Nothing a dispatcher types reaches the checkout.
      # The kogany entry always takes vaults/kogany-compat (its of_record).
      NODE_BRANCH: ${{ matrix.node_line != 'kogany' && contains(fromJSON('["upgrade/vault", "harden/yellowback"]'), github.ref_name) && github.ref_name || matrix.of_record }}
      NODE_LINE: ${{ matrix.node_line || matrix.node }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: node branch for this run
        run: echo "node line $NODE_REPO @ $NODE_BRANCH"
      # The stratum test miner (Python, stdlib only) lives in the node tree.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.NODE_REPO }}
          ref: ${{ env.NODE_BRANCH }}
          path: node
          persist-credentials: false
          sparse-checkout: |
            contrib/yellowback/devnet
            zcutil
      # koganyd-bin (workspace docs/plans/kogany/ci-design.md, "Artifact contracts"): kogany's
      # a kogany workflow uploads koganyd-bin.tgz (koganyd, koganyd-bin.json; dev profile,
      # --features ycash, ubuntu-24.04, linked against the runner's librocksdb) from push, schedule
      # and dispatch runs. Only such a run at kogany_ref is taken, never a pull_request run.
      - name: kogany's koganyd-bin at kogany_ref
        id: koganyd
        if: matrix.node_line == 'kogany'
        env:
          GH_TOKEN: ${{ github.token }}
          KOGANY_REF: ${{ matrix.kogany_ref }}
        run: |
          case "$KOGANY_REF" in *[!0-9a-f]*|'') echo "::error::kogany_ref is not a commit id"; exit 1 ;; esac
          trusted='select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")'
          runs=$(gh run list -R boyfromcave/kogany -c "$KOGANY_REF" -L 50 --json databaseId,event,headSha \
            -q ".[] | select(.headSha == \"$KOGANY_REF\") | $trusted | .databaseId" 2>/dev/null || true)
          for r in $runs; do
            if gh run download "$r" -R boyfromcave/kogany -n koganyd-bin -D "$RUNNER_TEMP/zk-dl" 2>/dev/null \
               && [ -f "$RUNNER_TEMP/zk-dl/koganyd-bin.tgz" ] && mkdir -p "$RUNNER_TEMP/zk" \
               && tar xzf "$RUNNER_TEMP/zk-dl/koganyd-bin.tgz" -C "$RUNNER_TEMP/zk"; then
              cat "$RUNNER_TEMP/zk/koganyd-bin.json"
              echo "KOGANYD=$RUNNER_TEMP/zk/koganyd" >> "$GITHUB_ENV"
              echo "got=true" >> "$GITHUB_OUTPUT"
              echo "koganyd from boyfromcave/kogany run $r"; exit 0
            fi
          done
          echo "got=false" >> "$GITHUB_OUTPUT"
          echo "no koganyd-bin of boyfromcave/kogany at $KOGANY_REF: building it here"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: matrix.node_line == 'kogany'
        with:
          repository: boyfromcave/kogany
          # The literal of matrix.kogany_ref (bump both): a fixed commit, nothing a dispatcher types.
          ref: dd834da8b77e882b9e6a00b3ce70f2b30b930c37
          path: kogany
          persist-credentials: false
          sparse-checkout: ${{ steps.koganyd.outputs.got == 'true' && '.github/actions/setup-zakura-build' || '' }}
      # kogany's setup-zakura-build action, run as its script (librocksdb-dev; no libclang, no
      # protoc): the build needs it, and so does a downloaded koganyd at run time.
      - name: kogany build packages
        if: matrix.node_line == 'kogany'
        env:
          INSTALL_LIBCLANG: "false"
          INSTALL_PROTOC: "false"
        run: bash kogany/.github/actions/setup-zakura-build/install-ubuntu-packages.sh
      # kogany's own rust-toolchain.toml applies inside its tree. Not cached (another repository's
      # build in this repository's cache scope).
      - name: build koganyd (kogany, --features ycash)
        if: matrix.node_line == 'kogany' && steps.koganyd.outputs.got != 'true'
        working-directory: kogany
        env:
          CARGO_INCREMENTAL: 0
        run: |
          cargo build --locked -p zakura --features ycash --bin koganyd
          echo "KOGANYD=$GITHUB_WORKSPACE/kogany/target/debug/koganyd" >> "$GITHUB_ENV"
      - name: koganyd runs here
        if: matrix.node_line == 'kogany'
        env:
          KOGANY_REF: ${{ matrix.kogany_ref }}
        run: |
          [ "$(git -C kogany rev-parse HEAD)" = "$KOGANY_REF" ] || { echo "::error::the kogany checkout's ref differs from matrix.kogany_ref"; exit 1; }
          if ldd "$KOGANYD" | grep 'not found'; then echo "::error::koganyd needs a library this runner lacks"; exit 1; fi
          "$KOGANYD" --version
      - name: download ycashd from the node line's CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dst="$RUNNER_TEMP/node"; mkdir -p "$dst"
          # Only a run of the node line's own branch, started by a push, the schedule or a dispatch:
          # never a pull_request run, whose artifact a fork's code built (a fork PR's head branch
          # may carry the same name), and never another branch's run.
          trusted='select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")'
          if [ -n "$NODE_RUN_ID" ]; then
            case "$NODE_RUN_ID" in ''|*[!0-9]*) echo "::error::node_run_id is not a run id"; exit 1 ;; esac
            runs=$(gh run view "$NODE_RUN_ID" -R "$NODE_REPO" --json databaseId,event,headBranch \
              -q "select(.headBranch == \"$NODE_BRANCH\") | $trusted | .databaseId")
            [ -n "$runs" ] || { echo "::error::run $NODE_RUN_ID is not a push/schedule/dispatch run of $NODE_REPO $NODE_BRANCH"; exit 1; }
          else
            runs=$(gh run list -R "$NODE_REPO" -w yellowback-tests.yml -b "$NODE_BRANCH" -L 20 --json databaseId,event -q ".[] | $trusted | .databaseId")
          fi
          for r in $runs; do
            if gh run download "$r" -R "$NODE_REPO" -n "$NODE_ARTIFACT" -D "$RUNNER_TEMP/dl" 2>/dev/null; then
              echo "ycashd from $NODE_REPO run $r"; break
            fi
          done
          # node-bin holds one tar that keeps the executable bits, with src/ycashd and src/ycash-cli
          # (plus test binaries) at its root: ycash-dd uploads node-bin.tar, ycash6 node-bin.tgz.
          if [ -f "$RUNNER_TEMP/dl/node-bin.tar" ]; then tar -xf "$RUNNER_TEMP/dl/node-bin.tar" -C "$dst" src/ycashd src/ycash-cli
          elif [ -f "$RUNNER_TEMP/dl/node-bin.tgz" ]; then tar -xzf "$RUNNER_TEMP/dl/node-bin.tgz" -C "$dst" src/ycashd src/ycash-cli
          else echo "::error::no artifact $NODE_ARTIFACT (node-bin.tar / node-bin.tgz) in $NODE_REPO runs on $NODE_BRANCH ($runs)"; ls -lR "$RUNNER_TEMP/dl" 2>/dev/null || true; exit 1; fi
          test -x "$dst/src/ycashd" && test -x "$dst/src/ycash-cli"
          ls -l "$dst/src"
      # Not cached: this job runs code from another repository's tree (fetch-params.sh, ycashd) in
      # the dispatching branch's cache scope, the default branch's on a nightly, so it saves no
      # cache entry (rust-cache below restores, save-if: false).
      - name: fetch zcash params
        run: node/zcutil/fetch-params.sh
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: cargo test --features regtest --test regtest
        env:
          POOL_NODE_ARGS: ${{ matrix.pool_node_args }}
        run: |
          export YCASHD="$RUNNER_TEMP/node/src/ycashd" PYTHON=python3
          export STRATUM_MINER="$GITHUB_WORKSPACE/node/contrib/yellowback/devnet/stratum-miner"
          export YOLO_REGTEST_SCRATCH="$RUNNER_TEMP/yolo-regtest" YOLO_REGTEST_POOL_NODE_ARGS="$POOL_NODE_ARGS"
          # upgrade/vault nodes: Yellowback is a module of the Vault upgrade (README, "The vault
          # network upgrade"); the test mines 102..=h+1 across the activation first.
          # Other node lines have no vault upgrade: YOLO_REGTEST_LEGACY keeps the -yellowback flags.
          # The kogany line: yolo serves kogany's templates, in the vault mode always.
          if [ "$NODE_LINE" = kogany ]; then
            export YOLO_REGTEST_VAULT=110 YOLO_REGTEST_KOGANY="$KOGANYD"
          elif [ "$REF_NAME" = upgrade/vault ]; then export YOLO_REGTEST_VAULT=110; else export YOLO_REGTEST_LEGACY=1; fi
          cargo test --locked --features regtest --test regtest -- --nocapture
