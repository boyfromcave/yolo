# yolo CI (audit I-13, I-7): fmt, build, test and clippy (-D warnings) on Linux and macOS with
# the toolchain rust-toolchain.toml pins, then an advisory scan (cargo audit) and a
# licence/source/ban check (cargo deny). Third-party actions are pinned by commit, never by tag.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rustup (preinstalled on the hosted runners) installs the pinned toolchain and its
      # components from rust-toolchain.toml on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo build --locked --features regtest
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show active-toolchain
      # Token-free, as chain-viz: rustsec/audit-check posts a check run and needs `checks: write`,
      # which the read-only permissions block above does not grant (first run, 2026-10-02).
      - run: cargo install cargo-deny --version 0.18.3 --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo deny --locked check
      - run: cargo audit --deny warnings
