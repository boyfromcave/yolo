[toolchain]
# yolo builds on stable. This file also shields the crate from an enclosing rust-toolchain
# (ycash-dd pins 1.51 for librustzcash and checks yolo out under its tree in CI): rustup takes
# the nearest file, and 1.51 cannot read a v4 Cargo.lock.
# Pinned to an exact release (audit H-16 / I-8): a pool that assembles mainnet coinbases must
# build the same way next month. Bump by PR, together with the CI.
channel = "1.91.0"
components = ["clippy", "rustfmt"]
