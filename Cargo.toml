[package]
name = "yolo"
version = "0.13.0"
edition = "2021"
rust-version = "1.85"
description = "Ycash stratum pool (Rust rewrite of yecdev/yolo), Yellowback tag aware"
license = "MIT"

[[bin]]
name = "yolo"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
getrandom = "0.3"

[features]
# `cargo test --features regtest` runs the end-to-end tests that need YCASHD (Y3).
regtest = []

[profile.release]
opt-level = 2

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
